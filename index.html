<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Staff Attendance System</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            margin: 20px;\n        }\n        #dateTime {\n            margin-top: 20px;\n            font-size: 20px;\n            font-weight: bold;\n        }\n    </style>\n</head>\n<body>\n    <h1>Welcome to the Staff Attendance System</h1>\n    <p>This application logs attendance efficiently.</p>\n    <div id="dateTime"></div>\n    <script>\n        function updateDateTime() {\n            const now = new Date();\n            const formattedDate = now.toISOString().slice(0, 19).replace('T', ' ');\n            document.getElementById('dateTime').innerText = `Current Date and Time (UTC): ${formattedDate}`;\n        }\n        setInterval(updateDateTime, 1000);\n        updateDateTime();\n    </script>\n</body>\n</html>
